<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>위시리스트 | Blecozel</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .topbar-right a.current {
      color: var(--ink);
      font-weight: 700;
    }

    .wishlist-main {
      padding: 56px 7vw 96px;
    }

    .wishlist-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 24px;
    }

    .wishlist-title h1 {
      font-size: clamp(1.8rem, 2.8vw, 2.5rem);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .wishlist-title p {
      color: var(--muted);
    }

    .wishlist-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 12px;
      min-width: min(420px, 100%);
    }

    .summary-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 10px 24px rgba(17, 24, 39, 0.06);
    }

    .summary-card .label {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 4px;
    }

    .summary-card strong {
      font-size: 1.28rem;
      letter-spacing: -0.01em;
    }

    .filter-row {
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .filter-chip.active {
      background: #111315;
      color: #fff;
      border-color: #111315;
    }

    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .wish-card {
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 18px 32px rgba(17, 24, 39, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .wish-media {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .wish-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .wish-meta {
      font-size: 0.86rem;
      color: var(--muted);
    }

    .wish-title {
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .wish-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .wish-tags span {
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.78rem;
    }

    .wish-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
    }

    .wish-actions button,
    .wish-actions a {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .button-outline {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
    }

    .button-solid {
      border: 1px solid #111315;
      background: #111315;
      color: #fff;
    }

    .wishlist-footer-note {
      margin-top: 22px;
      border: 1px dashed #cfd4da;
      border-radius: 14px;
      padding: 16px;
      color: var(--muted);
      font-size: 0.92rem;
      background: rgba(255, 255, 255, 0.68);
    }

    .wishlist-empty {
      border: 1px dashed #cfd4da;
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.72);
    }

    @media (max-width: 1100px) {
      .wishlist-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .wishlist-summary {
        width: 100%;
      }

      .wishlist-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .wishlist-main {
        padding-top: 36px;
      }

      .wishlist-summary {
        grid-template-columns: 1fr;
      }

      .wishlist-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="grain"></div>

  <div class="topbar">
    <div class="topbar-left">
      <a href="index.html#estimate">상담신청</a>
      <a href="index.html#portfolio">시공사례</a>
      <a href="index.html#pricing">토탈 패키지</a>
      <a href="index.html#faq">고객지원</a>
    </div>
    <div class="topbar-right">
      <a href="signup.html">회원가입</a>
      <a href="login.html">로그인</a>
      <a href="mypage.html">마이페이지</a>
      <a class="current" href="wishlist.html">위시리스트</a>
    </div>
  </div>

  <header class="nav">
    <a class="logo" href="index.html">Blecozel</a>
    <nav class="nav-links">
      <a href="index.html#categories">공간 카테고리</a>
      <a href="index.html#portfolio">시공사례</a>
      <a href="index.html#pricing">패키지</a>
      <a href="index.html#hero-carousel">진행 방식</a>
      <a href="index.html#estimate">상담신청</a>
    </nav>
    <a class="nav-cta" href="index.html#estimate">무료 사전설계 받기</a>
  </header>

  <main class="wishlist-main">
    <div class="wishlist-head">
      <div class="wishlist-title">
        <h1>내 위시리스트</h1>
        <p>저장한 공간 패키지를 비교하고 바로 상담 요청까지 진행할 수 있습니다.</p>
      </div>
      <div class="wishlist-summary" aria-label="위시리스트 요약">
        <article class="summary-card">
          <span class="label">저장한 항목</span>
          <strong id="wishlist-count">0개</strong>
        </article>
        <article class="summary-card">
          <span class="label">상담 요청</span>
          <strong id="consult-request-count">0건</strong>
        </article>
        <article class="summary-card">
          <span class="label">최근 업데이트</span>
          <strong id="wishlist-updated-at">-</strong>
        </article>
      </div>
    </div>

    <div class="filter-row" aria-label="위시리스트 필터">
      <button class="filter-chip active" data-filter="all" type="button">전체</button>
      <button class="filter-chip" data-filter="residential" type="button">주거</button>
      <button class="filter-chip" data-filter="commercial" type="button">상업</button>
      <button class="filter-chip" data-filter="budget" type="button">예산 2000만 이하</button>
      <button class="filter-chip" data-filter="render3d" type="button">3D 제안 가능</button>
    </div>

    <section class="wishlist-grid" id="wishlist-grid" aria-label="저장된 위시리스트 항목"></section>
    <div class="wishlist-empty" id="wishlist-empty" hidden>조건에 맞는 위시리스트가 없습니다. 필터를 바꾸거나 새 항목을 저장해 주세요.</div>

    <p class="wishlist-footer-note">관심 항목은 최근 조회 기준으로 자동 정렬됩니다. 상담 요청 시 담당 디자이너가 48시간 이내 연락드립니다.</p>
  </main>
  <script defer src="/main.js"></script>
</body>
</html>
