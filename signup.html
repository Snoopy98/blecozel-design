<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blecozel Design - 회원가입</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #333;
      --muted: #777;
      --line: #ccc;
      --line-soft: #eee;
      --soft: #f9f9f9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: var(--muted);
      font-family: Roboto, "Noto Sans KR", "Noto Sans", "Malgun Gothic", arial, sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .signup-header {
      border-bottom: 1px solid var(--line-soft);
    }

    .header-inner {
      max-width: 1366px;
      height: 110px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      display: inline-block;
      color: var(--ink);
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .signup-main {
      padding: 52px 20px 100px;
    }

    .signup-shell {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .page-title {
      margin: 0 0 22px;
      text-align: center;
      color: var(--ink);
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .stepper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 28px;
    }

    .step {
      border: 1px solid var(--line-soft);
      background: #fff;
      color: #999;
      border-radius: 10px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
    }

    .step.active {
      border-color: #333;
      color: #333;
      font-weight: 700;
      background: #fcfcfc;
    }

    .form-block {
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .block-title {
      margin: 0 0 16px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }

    .field + .field {
      margin-top: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #666;
      font-size: 13px;
      font-weight: 500;
    }

    .input,
    .select {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      padding: 0 14px;
      font-size: 15px;
      color: var(--ink);
      background: #fff;
    }

    .input::placeholder {
      color: #999;
    }

    .input:focus,
    .select:focus {
      outline: none;
      border-color: #333;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.08);
    }

    .inline-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .inline-row .button-sub {
      min-width: 112px;
    }

    .field-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .check-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .check-item {
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 10px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #666;
      font-size: 14px;
    }

    .check-item input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #333;
    }

    .terms-box {
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      padding: 14px;
      background: #fcfcfc;
    }

    .terms-all {
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line-soft);
      margin-bottom: 10px;
      font-weight: 600;
      color: #444;
    }

    .terms-list {
      display: grid;
      gap: 8px;
      font-size: 14px;
      color: #666;
    }

    .terms-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .terms-item label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .terms-item input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #333;
    }

    .terms-item a {
      color: #888;
      font-size: 13px;
    }

    .button-primary {
      margin-top: 16px;
      width: 100%;
      height: 54px;
      border: 1px solid transparent;
      background: #333;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .button-primary:hover {
      background: #2d2d2d;
    }

    .button-sub {
      height: 48px;
      border: 1px solid #bbb;
      background: #fff;
      color: #555;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 14px;
    }

    .help-text {
      margin-top: 8px;
      color: #9a9a9a;
      font-size: 12px;
    }

    .member-links {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 18px;
      font-size: 14px;
      color: #666;
    }

    .member-links a + a {
      position: relative;
    }

    .member-links a + a::before {
      content: "";
      position: absolute;
      left: -9px;
      top: 50%;
      width: 1px;
      height: 12px;
      background: #d8d8d8;
      transform: translateY(-50%);
    }

    @media (max-width: 640px) {
      .header-inner {
        height: 86px;
      }

      .brand {
        font-size: 26px;
      }

      .signup-main {
        padding: 38px 16px 72px;
      }

      .page-title {
        font-size: 30px;
      }

      .form-block {
        padding: 16px;
      }

      .field-row-2,
      .check-list {
        grid-template-columns: 1fr;
      }

      .inline-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="signup-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="메인으로 이동">Blecozel Design</a>
    </div>
  </header>

  <main class="signup-main">
    <section class="signup-shell">
      <h1 class="page-title">회원가입</h1>

      <div class="stepper" aria-label="가입 단계">
        <div class="step">01 약관동의</div>
        <div class="step active">02 정보입력</div>
        <div class="step">03 가입완료</div>
      </div>

      <form action="#" method="post">
        <div class="form-block">
          <h2 class="block-title">기본 정보</h2>

          <div class="field">
            <label for="signup-name">이름</label>
            <input class="input" id="signup-name" name="signup-name" type="text" placeholder="이름을 입력해 주세요" autocomplete="name" required />
          </div>

          <div class="field">
            <label for="signup-phone">휴대폰 번호</label>
            <div class="inline-row">
              <input class="input" id="signup-phone" name="signup-phone" type="tel" placeholder="숫자만 입력해 주세요" autocomplete="tel" required />
              <button class="button-sub" type="button">인증요청</button>
            </div>
          </div>

          <div class="field">
            <label for="signup-email">이메일</label>
            <input class="input" id="signup-email" name="signup-email" type="email" placeholder="example@email.com" autocomplete="email" required />
          </div>
        </div>

        <div class="form-block">
          <h2 class="block-title">계정 정보</h2>

          <div class="field">
            <label for="signup-id">아이디</label>
            <div class="inline-row">
              <input class="input" id="signup-id" name="signup-id" type="text" placeholder="영문/숫자 6-20자" autocomplete="username" required />
              <button class="button-sub" type="button">중복확인</button>
            </div>
          </div>

          <div class="field-row-2">
            <div class="field">
              <label for="signup-password">비밀번호</label>
              <input class="input" id="signup-password" name="signup-password" type="password" placeholder="영문, 숫자, 특수문자 조합" autocomplete="new-password" required />
            </div>
            <div class="field">
              <label for="signup-password-confirm">비밀번호 확인</label>
              <input class="input" id="signup-password-confirm" name="signup-password-confirm" type="password" placeholder="비밀번호를 다시 입력해 주세요" autocomplete="new-password" required />
            </div>
          </div>

          <p class="help-text">비밀번호는 8자 이상이며 영문, 숫자, 특수문자를 포함해야 합니다.</p>
        </div>

        <div class="form-block">
          <h2 class="block-title">관심 공간 선택</h2>
          <div class="check-list">
            <label class="check-item"><input type="checkbox" name="interest" value="kitchen" /><span>주방</span></label>
            <label class="check-item"><input type="checkbox" name="interest" value="bath" /><span>욕실</span></label>
            <label class="check-item"><input type="checkbox" name="interest" value="storage" /><span>붙박이장</span></label>
            <label class="check-item"><input type="checkbox" name="interest" value="window" /><span>창호</span></label>
            <label class="check-item"><input type="checkbox" name="interest" value="door" /><span>홈도어/중문</span></label>
            <label class="check-item"><input type="checkbox" name="interest" value="total" /><span>토탈 패키지</span></label>
          </div>
        </div>

        <div class="form-block">
          <h2 class="block-title">약관 동의</h2>
          <div class="terms-box">
            <div class="terms-all">
              <label><input type="checkbox" required /> 필수 및 선택 항목 전체 동의</label>
            </div>
            <div class="terms-list">
              <div class="terms-item">
                <label><input type="checkbox" required /> [필수] 이용약관 동의</label>
                <a href="#">보기</a>
              </div>
              <div class="terms-item">
                <label><input type="checkbox" required /> [필수] 개인정보 수집 및 이용 동의</label>
                <a href="#">보기</a>
              </div>
              <div class="terms-item">
                <label><input type="checkbox" /> [선택] 마케팅 정보 수신 동의</label>
                <a href="#">보기</a>
              </div>
            </div>
          </div>
        </div>

        <button class="button-primary" type="submit">회원가입 완료</button>
      </form>

      <div class="member-links">
        <a href="login.html">이미 계정이 있어요</a>
        <a href="index.html">메인으로 돌아가기</a>
      </div>
    </section>
  </main>
</body>
</html>
